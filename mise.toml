[tools]
"aqua:golangci/golangci-lint" = "latest"
betterleaks = "latest"
go = "1.27.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "latest"
hk = "2"
jactionlint = "latest"
lychee = "latest"
node = "26"
"npm:@commitlint/cli" = "latest"
"npm:@commitlint/config-conventional" = "latest"
pkl = "latest"
rumdl = "latest"
typos = "latest"

# Задачи проекта живут здесь, Makefile только проксирует make <задача> в mise run.
[tasks.setup]
description = "Поставить зависимости и git-хуки"
run = ["go mod download", "hk install"]

[tasks.test]
description = "Тесты HTTP-контракта приложения"
run = "go test ./..."

[tasks.start]
description = "Запустить приложение локально"
run = "go run ."

[tasks.check]
description = "Все проверки, тот же набор, что гоняет CI"
run = "hk check --all"

[tasks.fix]
description = "Применить автоисправления"
run = "hk fix --all"
